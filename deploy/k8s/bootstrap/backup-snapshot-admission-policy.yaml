# Admission-Guard für die Job-Erstellung durch die Backup-Identität (P1).
#
# Die Backup-Rolle (backup-snapshot-rbac.yaml) braucht ``jobs: create`` für den
# Snapshot→Restore→tar-Helfer. ``jobs: create`` allein wäre aber KEINE echte
# Least-Privilege: die Identität könnte damit einen Job mit FREMDER
# serviceAccountName, BELIEBIGEN Secret-Mounts, fremden PVCs, hostPath oder
# privilegierten Containern anlegen und so aus dem Namespace ausbrechen bzw.
# fremde Secrets exfiltrieren – obwohl RBAC ihr kein direktes ``get secrets``
# erlaubt (ein Job mit ``envFrom: secretRef`` liest das Secret dennoch).
#
# Diese ValidatingAdmissionPolicy schränkt daher – NUR für Requests der
# Backup-Identität ``system:serviceaccount:dms:dms-backup`` – die zulässige
# Job-Form eng ein:
#   * serviceAccountName == ``dms-backup-helper`` (eigene SA OHNE API-Rechte)
#   * automountServiceAccountToken == false (der Helfer bekommt KEIN Token)
#   * Secrets NUR aus einer exakten Allowlist (envFrom/env/volumes/projected)
#   * PVC-Mounts NUR das Restore-PVC (``dms-data-restore-*``)
#   * Image NUR das dms-backend-Repo der eigenen Registry, niemals ``:latest``
#   * kein hostPath, kein hostNetwork/PID/IPC, kein privileged,
#     allowPrivilegeEscalation == false, keine zusätzlichen Capabilities
# Da die ``matchConditions`` ausschließlich auf diese eine Identität greifen,
# kann die Policy KEINE anderen Workloads (Backend/Celery/Postgres) beeinflussen –
# ein etwaiger CEL-Fehler bliebe auf die (ohnehin suspendierte) Backup-Job-
# Erstellung beschränkt.
#
# CLUSTER-SCOPED -> Admin-Bootstrap. Setzt k8s ≥ 1.30 (ValidatingAdmissionPolicy
# GA; bei k3s vorhanden) voraus.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dms-backup-job-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  matchConditions:
    # NUR Jobs, die von der Backup-Identität erstellt werden – nichts anderes.
    - name: only-dms-backup-sa
      expression: "request.userInfo.username == 'system:serviceaccount:dms:dms-backup'"
  variables:
    - name: podspec
      expression: "object.spec.template.spec"
    - name: allctrs
      expression: >-
        object.spec.template.spec.containers +
        object.spec.template.spec.?initContainers.orValue([])
    # Exakte Allowlist der Secrets, die der Backup-Helfer referenzieren darf: das
    # DEDIZIERTE DB-Backup-Secret (nur DJANGO_SECRET_KEY/POSTGRES_PASSWORD/
    # REDIS_PASSWORD) + das SSH/scp-Ziel. NICHT das gesamte ``dms-secrets`` (P1) –
    # sonst könnte der Helfer alle Anwendungsschlüssel (AI/IMAP/…) exfiltrieren.
    - name: allowedSecrets
      expression: "['dms-db-backup-secrets', 'dms-backup-secrets']"
    - name: allvolumes
      expression: "object.spec.template.spec.?volumes.orValue([])"
  validations:
    # --- Identität des Helfers: eigene, rechtelose, token-lose SA -------------
    - expression: >-
        has(variables.podspec.serviceAccountName) &&
        variables.podspec.serviceAccountName == 'dms-backup-helper'
      message: "Backup-Helfer-Jobs müssen serviceAccountName=dms-backup-helper verwenden."
    - expression: >-
        has(variables.podspec.automountServiceAccountToken) &&
        variables.podspec.automountServiceAccountToken == false
      message: "Backup-Helfer-Jobs dürfen kein ServiceAccount-Token einhängen (automountServiceAccountToken=false)."
    # --- Secret-Referenzen nur aus der Allowlist -----------------------------
    - expression: >-
        variables.allctrs.all(c,
          c.?envFrom.orValue([]).all(e,
            !has(e.secretRef) || e.secretRef.name in variables.allowedSecrets
          )
        )
      message: "envFrom.secretRef ist nur für dms-secrets/dms-backup-secrets erlaubt."
    - expression: >-
        variables.allctrs.all(c,
          c.?env.orValue([]).all(e,
            !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
            e.valueFrom.secretKeyRef.name in variables.allowedSecrets
          )
        )
      message: "env.valueFrom.secretKeyRef ist nur für dms-secrets/dms-backup-secrets erlaubt."
    - expression: >-
        variables.allvolumes.all(v,
          !has(v.secret) || v.secret.secretName in variables.allowedSecrets
        )
      message: "secret-Volumes sind nur für dms-secrets/dms-backup-secrets erlaubt."
    - expression: >-
        variables.allvolumes.all(v,
          !has(v.projected) ||
          v.projected.?sources.orValue([]).all(s,
            !has(s.secret) || s.secret.name in variables.allowedSecrets
          )
        )
      message: "projizierte secret-Volumes sind nur für dms-secrets/dms-backup-secrets erlaubt."
    # --- PVC-Mounts nur das Restore-PVC --------------------------------------
    - expression: >-
        variables.allvolumes.all(v,
          !has(v.persistentVolumeClaim) ||
          v.persistentVolumeClaim.claimName.matches('^dms-data-restore-[0-9a-zA-Z-]+$')
        )
      message: "PVC-Mounts sind nur für das Restore-PVC (dms-data-restore-*) erlaubt."
    # --- Host-Namespaces / hostPath / privileged -----------------------------
    - expression: "variables.allvolumes.all(v, !has(v.hostPath))"
      message: "hostPath-Volumes sind in Backup-Jobs verboten."
    - expression: >-
        !variables.podspec.?hostNetwork.orValue(false) &&
        !variables.podspec.?hostPID.orValue(false) &&
        !variables.podspec.?hostIPC.orValue(false)
      message: "hostNetwork/hostPID/hostIPC sind in Backup-Jobs verboten."
    - expression: >-
        variables.allctrs.all(c, !c.?securityContext.?privileged.orValue(false))
      message: "Privilegierte Container sind in Backup-Jobs verboten."
    - expression: >-
        variables.allctrs.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: "Backup-Container müssen allowPrivilegeEscalation=false setzen."
    - expression: >-
        variables.allctrs.all(c, c.?securityContext.?capabilities.?add.orValue([]).size() == 0)
      message: "Backup-Container dürfen keine zusätzlichen Capabilities anfordern."
    # --- Image nur das dms-backend-Repo, niemals :latest ---------------------
    - expression: >-
        variables.allctrs.all(c,
          c.image.startsWith('registry.stoegerer-home.at/dms-backend@sha256:') ||
          (c.image.startsWith('registry.stoegerer-home.at/dms-backend:') && !c.image.endsWith(':latest'))
        )
      message: "In Backup-Jobs ist nur ein gepinntes dms-backend-Image der eigenen Registry erlaubt (kein :latest)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dms-backup-job-guard
spec:
  policyName: dms-backup-job-guard
  validationActions: ["Deny"]
  # Nur im dms-Namespace auswerten (dort läuft das Backup).
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: dms
---
# Snapshot-Quelle einschränken (P1): Die Backup-Identität darf per RBAC
# VolumeSnapshots anlegen. Ohne diese Policy könnte sie einen Snapshot eines
# BELIEBIGEN PVC (z. B. postgres-data oder ein fremdes Volume) erstellen, daraus
# ein Restore-PVC bauen und es im Helfer mounten -> Datenabfluss. Diese Policy
# erlaubt der Backup-Identität ausschließlich Snapshots des Daten-PVC ``dms-data``.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dms-backup-snapshot-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["snapshot.storage.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["volumesnapshots"]
  matchConditions:
    - name: only-dms-backup-sa
      expression: "request.userInfo.username == 'system:serviceaccount:dms:dms-backup'"
  validations:
    - expression: >-
        has(object.spec.source) &&
        has(object.spec.source.persistentVolumeClaimName) &&
        object.spec.source.persistentVolumeClaimName == 'dms-data'
      message: "Die Backup-Identität darf nur das Daten-PVC dms-data snapshotten."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dms-backup-snapshot-guard
spec:
  policyName: dms-backup-snapshot-guard
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: dms
---
# Restore-PVC einschränken (P1): Die Backup-Identität darf PVCs anlegen. Ohne
# diese Policy könnte sie ein PVC mit beliebiger dataSource (z. B. einem fremden
# Snapshot) unter einem erlaubten ``dms-data-restore-*``-Namen erzeugen und
# mounten. Diese Policy erzwingt: Name ``dms-data-restore-*`` UND dataSource ist
# ein VolumeSnapshot der eigenen Snapshot-Serie ``dms-data-snap-*``.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: dms-backup-restore-pvc-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims"]
  matchConditions:
    - name: only-dms-backup-sa
      expression: "request.userInfo.username == 'system:serviceaccount:dms:dms-backup'"
  validations:
    - expression: "object.metadata.name.matches('^dms-data-restore-[0-9a-zA-Z-]+$')"
      message: "Backup-PVCs müssen dms-data-restore-* heißen."
    - expression: >-
        has(object.spec.dataSource) &&
        object.spec.dataSource.kind == 'VolumeSnapshot' &&
        object.spec.dataSource.?apiGroup.orValue('') == 'snapshot.storage.k8s.io' &&
        object.spec.dataSource.name.matches('^dms-data-snap-[0-9a-zA-Z-]+$')
      message: "Backup-PVCs müssen aus einem eigenen VolumeSnapshot (dms-data-snap-*) restauriert werden."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: dms-backup-restore-pvc-guard
spec:
  policyName: dms-backup-restore-pvc-guard
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: dms
