# Konsistenter Snapshot-Backup-Job (P1) – SUSPENDIERT ausgeliefert.
#
# Warum: Das aktive live-tar-Backup (backup-cronjob.yaml) macht pg_dump und tart
# DANACH das WÄHRENDDESSEN veränderbare /data. Löscht ein paralleler Vorgang
# zwischen beiden Schritten eine Datei, referenziert der Dump eine nicht
# gesicherte Datei (Inkonsistenz). Dieser Job löst das über einen koordinierten
# Longhorn/CSI-Snapshot: er tart aus einem UNVERÄNDERLICHEN Restore-Volume, das
# den Zustand eines einzigen Zeitpunkts festhält.
#
# ``suspend: true`` (bewusst): Der Snapshot-Pfad ist clusterabhängig (Longhorn-
# VolumeSnapshotClass, CSI) und wurde NICHT auf diesem Cluster verifiziert. Er
# wird ausgeliefert, aber NICHT automatisch aktiv – erst nach einem erfolgreichen
# Test-Lauf am Cluster (siehe docs/backup-snapshot.md) auf ``suspend: false``
# stellen UND danach die live-tar-CronJob ``backup`` suspendieren. So bleibt das
# funktionierende Backup unangetastet, bis der Snapshot-Pfad validiert ist.
#
# DB-/Datei-Konsistenz (P1): Der /data-Snapshot (Schritt 1) und der pg_dump des
# Helfers (Schritt 3) liegen zeitlich auseinander – ein dazwischen hochgeladenes
# Dokument stünde nur im Dump. Deshalb setzt der Orchestrator VOR dem Snapshot eine
# kurze Backup-Schreibsperre (``manage.py backup_quiesce --on``, per kubectl exec
# ins Backend) und der Helfer hebt sie direkt nach dem pg_dump wieder auf. Während
# der Sperre antworten Upload/Mobile-Capture/Version mit 503 und die Consume-/Mail-
# Beat-Tasks pausieren (Enforcement im Backend, s. documents/services/quiesce.py).
# Voraussetzung fürs Aktivieren: Bootstrap-RBAC um ``pods/exec`` (dms-backup) ergänzen.
#
# Voraussetzungen (Bootstrap, deploy/k8s/bootstrap): SA dms-backup + dms-backup-
# helper, RBAC, VolumeSnapshotClass ``dms-longhorn-snapshot`` und der Admission-
# Guard. Der Helfer-Job erfüllt den Guard exakt (token-lose SA, nur erlaubte
# Secrets, Restore-PVC, gepinntes dms-backend-Image, kein Privesc).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dms-backup-snapshot-script
  namespace: dms
data:
  # Backup-Skript des Helfer-Jobs. Bewusst als ConfigMap (nicht inline im
  # Orchestrator-Heredoc): so werden die Helfer-Laufzeit-Variablen
  # (${POSTGRES_PASSWORD} …) NICHT versehentlich vom Orchestrator-Shell expandiert.
  # /data ist hier das RO-Restore-Volume (konsistenter Snapshot-Zeitpunkt).
  backup.sh: |
    set -e

    TIMESTAMP="${SNAP_TIMESTAMP:-$(date +%Y%m%d-%H%M%S)}"
    MONITOR_OK=0
    BACKUP_DIR="/backup"
    DB_BACKUP="${BACKUP_DIR}/db-${TIMESTAMP}.sql.gz"
    DATA_BACKUP="${BACKUP_DIR}/data-${TIMESTAMP}.tar.gz"

    record_backup_status() {
      size_arg=""
      [ -n "$3" ] && size_arg="--size-bytes $3"
      python manage.py record_backup_status \
        --kind backup \
        --status "$1" \
        --artifact-timestamp "${TIMESTAMP}" \
        --message "$2" $size_arg || true
    }

    on_exit() {
      code=$?
      if [ "$code" -ne 0 ] && [ "$MONITOR_OK" -ne 1 ]; then
        record_backup_status failed "Snapshot-Backup fehlgeschlagen (Exit ${code})"
      fi
    }
    trap on_exit EXIT

    mkdir -p "${BACKUP_DIR}"
    echo "=== DMS Snapshot-Backup Start: ${TIMESTAMP} ==="
    record_backup_status running "Snapshot-Backup-Helfer läuft"

    # --- SSH-Key + Wrapper ---
    SSH_KEY_FILE="/tmp/backup_ssh_key"
    printf '%s\n' "${BACKUP_SSH_KEY}" > "${SSH_KEY_FILE}"
    chmod 600 "${SSH_KEY_FILE}"
    SSH_WRAPPER="/tmp/backup_ssh"
    {
      printf '#!/bin/sh\n'
      printf 'exec ssh -p "%s" -i "%s" -o IdentitiesOnly=yes -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no "$@"\n' "${BACKUP_SSH_PORT:-22}" "${SSH_KEY_FILE}"
    } > "${SSH_WRAPPER}"
    chmod 700 "${SSH_WRAPPER}"

    echo "--- SSH-Vorabprüfung: ${BACKUP_SSH_USER}@${BACKUP_SSH_HOST} (Port ${BACKUP_SSH_PORT:-22})"
    if ! "${SSH_WRAPPER}" "${BACKUP_SSH_USER}@${BACKUP_SSH_HOST}" "echo SSH OK"; then
      record_backup_status failed "SSH-Auth zur NAS abgelehnt – Public-Key/authorized_keys prüfen (Port ${BACKUP_SSH_PORT:-22})."
      MONITOR_OK=1
      echo "FEHLER: SSH-Auth zur NAS fehlgeschlagen – pg_dump/tar übersprungen." >&2
      exit 1
    fi

    echo "--- pg_dump: ${POSTGRES_DB}"
    DB_DUMP_TMP="${BACKUP_DIR}/db-${TIMESTAMP}.sql"
    PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
      -h "${POSTGRES_HOST}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
      > "${DB_DUMP_TMP}"
    gzip "${DB_DUMP_TMP}"

    # Backup-Schreibsperre AUFHEBEN (P1): /data-Snapshot (vom Orchestrator VOR dem
    # VolumeSnapshot gesetzt) UND dieser pg_dump spiegeln jetzt denselben Zustand –
    # der konsistente Zeitpunkt ist eingefangen. tar/Upload lesen nur noch den
    # unveränderlichen Snapshot, daher darf ab hier wieder geschrieben werden. Der
    # TTL-Backstop (Orchestrator: --ttl) hebt die Sperre notfalls ohnehin auf.
    echo "--- pg_dump fertig – Backup-Schreibsperre aufheben"
    python manage.py backup_quiesce --off || true

    echo "--- tar: /data (konsistenter Snapshot) → ${DATA_BACKUP}"
    tar -czf "${DATA_BACKUP}" -C /data originals archive thumbnails consume

    echo "--- Übertragung → ${BACKUP_SSH_USER}@${BACKUP_SSH_HOST}:${BACKUP_TARGET_PATH}"
    scp -O -S "${SSH_WRAPPER}" \
      "${DB_BACKUP}" "${DATA_BACKUP}" \
      "${BACKUP_SSH_USER}@${BACKUP_SSH_HOST}:${BACKUP_TARGET_PATH}/"

    echo "--- Rotation: behalte letzte ${BACKUP_RETENTION} Backups"
    "${SSH_WRAPPER}" "${BACKUP_SSH_USER}@${BACKUP_SSH_HOST}" \
      "cd ${BACKUP_TARGET_PATH} && ls -t db-*.sql.gz | tail -n +$((BACKUP_RETENTION + 1)) | xargs -r rm -v && ls -t data-*.tar.gz | tail -n +$((BACKUP_RETENTION + 1)) | xargs -r rm -v"

    rm -f "${SSH_KEY_FILE}" "${SSH_WRAPPER}"
    TOTAL_BYTES=$(( $(wc -c < "${DB_BACKUP}") + $(wc -c < "${DATA_BACKUP}") ))
    record_backup_status success "Snapshot-Backup erfolgreich abgeschlossen" "${TOTAL_BYTES}"
    MONITOR_OK=1
    echo "=== Snapshot-Backup abgeschlossen: ${TIMESTAMP} ==="
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-snapshot
  namespace: dms
spec:
  # SUSPENDIERT: erst nach erfolgreichem Cluster-Testlauf aktivieren (s. o.).
  suspend: true
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 5400
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: backup-snapshot
        spec:
          serviceAccountName: dms-backup
          restartPolicy: OnFailure
          containers:
            # Orchestrator: kubectl-fähiges Image. Das offizielle
            # ``registry.k8s.io/kubectl`` EXISTIERT (anders als das frühere
            # ``bitnami/kubectl:1.30``, das keinen Manifest-Eintrag hat) und ist auf
            # den Cluster (k3s 1.33) versioniert – innerhalb der ±1-Minor-Skew-Policy.
            # HÄRTUNG für den Betrieb: in die eigene Registry spiegeln und per Digest
            # pinnen, z. B.:
            #   skopeo copy docker://registry.k8s.io/kubectl:v1.33.4 \
            #     docker://registry.stoegerer-home.at/kubectl:v1.33.4
            #   image: registry.stoegerer-home.at/kubectl@sha256:<digest>
            # (Vom Admission-Guard NICHT betroffen: der greift nur auf Jobs, die von
            # dms-backup erstellt werden – also den HELFER, nicht den Orchestrator.)
            - name: orchestrator
              image: registry.k8s.io/kubectl:v1.33.4
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  TS=$(date +%Y%m%d-%H%M%S)
                  SNAP="dms-data-snap-${TS}"
                  PVC="dms-data-restore-${TS}"
                  JOB="backup-snap-tar-${TS}"

                  cleanup() {
                    # Backup-Schreibsperre IMMER best-effort aufheben – falls der
                    # Helfer sie nicht schon nach dem pg_dump gelöst hat (z. B.
                    # Abbruch vor dem Helfer). Der TTL-Backstop greift zusätzlich.
                    kubectl -n dms exec deploy/backend -- \
                      python manage.py backup_quiesce --off || true
                    kubectl -n dms delete job "$JOB" --ignore-not-found
                    kubectl -n dms delete pvc "$PVC" --ignore-not-found
                    kubectl -n dms delete volumesnapshot "$SNAP" --ignore-not-found
                  }
                  trap cleanup EXIT

                  # Aktuell deploytes Backend-Image auflösen (echter Registry-Tag).
                  HELPER_IMAGE=$(kubectl -n dms get deploy backend \
                    -o jsonpath='{.spec.template.spec.containers[0].image}')
                  echo "Helfer-Image: ${HELPER_IMAGE}"

                  # Restore-PVC-Größe DYNAMISCH aus dem Quell-PVC übernehmen (P2):
                  # ein hart kodiertes 20Gi kann einen inzwischen gewachsenen
                  # dms-data-Snapshot nicht mehr aufnehmen (Restore schlägt fehl).
                  SRC_SIZE=$(kubectl -n dms get pvc dms-data \
                    -o jsonpath='{.spec.resources.requests.storage}')
                  [ -n "${SRC_SIZE}" ] || SRC_SIZE=20Gi
                  echo "Restore-PVC-Größe: ${SRC_SIZE}"

                  # 0) Backup-Schreibsperre AKTIVIEREN, BEVOR der /data-Snapshot
                  #    entsteht. Sonst könnte ein zwischen /data-Snapshot (Schritt 1)
                  #    und dem pg_dump des Helfers (Schritt 3) hochgeladenes Dokument
                  #    NUR im DB-Dump landen (baumelt im Restore ohne Datei). Der
                  #    Helfer hebt die Sperre direkt nach dem pg_dump wieder auf; die
                  #    ``--ttl`` ist die Notbremse gegen einen hängenden Lauf.
                  #    Voraussetzung (Bootstrap-RBAC): dms-backup braucht ``pods/exec``
                  #    im Namespace dms. Upload/Mobile-Capture/Version antworten
                  #    während der Sperre mit 503, Consume-/Mail-Beat pausiert.
                  echo "0) Backup-Schreibsperre aktivieren"
                  kubectl -n dms exec deploy/backend -- \
                    python manage.py backup_quiesce --on --ttl 1200

                  # 1) Snapshot des Daten-PVC + warten.
                  kubectl -n dms apply -f - <<EOF
                  apiVersion: snapshot.storage.k8s.io/v1
                  kind: VolumeSnapshot
                  metadata: { name: ${SNAP} }
                  spec:
                    volumeSnapshotClassName: dms-longhorn-snapshot
                    source: { persistentVolumeClaimName: dms-data }
                  EOF
                  kubectl -n dms wait --for=jsonpath='{.status.readyToUse}'=true \
                    volumesnapshot/${SNAP} --timeout=600s

                  # 2) Restore-PVC aus dem Snapshot.
                  kubectl -n dms apply -f - <<EOF
                  apiVersion: v1
                  kind: PersistentVolumeClaim
                  metadata: { name: ${PVC} }
                  spec:
                    storageClassName: longhorn
                    dataSource:
                      name: ${SNAP}
                      kind: VolumeSnapshot
                      apiGroup: snapshot.storage.k8s.io
                    accessModes: ["ReadWriteOnce"]
                    resources: { requests: { storage: ${SRC_SIZE} } }
                  EOF

                  # 3) Helfer-Job: tart aus dem KONSISTENTEN Restore-Volume + shipt.
                  #    Erfüllt den Admission-Guard (token-lose SA, nur erlaubte
                  #    Secrets, Restore-PVC, gepinntes dms-backend-Image, kein Privesc).
                  #    Das Backup-Skript kommt aus der ConfigMap (kein Heredoc-Escaping
                  #    der Helfer-Laufzeit-Variablen).
                  kubectl -n dms apply -f - <<EOF
                  apiVersion: batch/v1
                  kind: Job
                  metadata: { name: ${JOB} }
                  spec:
                    backoffLimit: 1
                    activeDeadlineSeconds: 3600
                    template:
                      spec:
                        serviceAccountName: dms-backup-helper
                        automountServiceAccountToken: false
                        restartPolicy: Never
                        containers:
                          - name: tar
                            image: ${HELPER_IMAGE}
                            securityContext:
                              privileged: false
                              allowPrivilegeEscalation: false
                              capabilities: { drop: ["ALL"] }
                            command: ["/bin/sh", "/scripts/backup.sh"]
                            env:
                              - name: SNAP_TIMESTAMP
                                value: "${TS}"
                              - name: DJANGO_SECRET_KEY
                                valueFrom: { secretKeyRef: { name: dms-db-backup-secrets, key: DJANGO_SECRET_KEY } }
                              - name: POSTGRES_PASSWORD
                                valueFrom: { secretKeyRef: { name: dms-db-backup-secrets, key: POSTGRES_PASSWORD } }
                            envFrom:
                              - configMapRef: { name: dms-config }
                              - secretRef: { name: dms-backup-secrets }
                            volumeMounts:
                              - { name: restore, mountPath: /data, readOnly: true }
                              - { name: script, mountPath: /scripts, readOnly: true }
                              - { name: backup-tmp, mountPath: /backup }
                            resources:
                              requests: { ephemeral-storage: "2Gi" }
                              limits: { ephemeral-storage: "20Gi" }
                        volumes:
                          - name: restore
                            persistentVolumeClaim: { claimName: ${PVC} }
                          - name: script
                            configMap: { name: dms-backup-snapshot-script }
                          - name: backup-tmp
                            emptyDir: { sizeLimit: 20Gi }
                  EOF

                  # 4) Auf den Helfer warten + Ergebnis übernehmen.
                  kubectl -n dms wait --for=condition=complete --timeout=3600s job/${JOB} \
                    || { kubectl -n dms logs job/${JOB} || true; exit 1; }
