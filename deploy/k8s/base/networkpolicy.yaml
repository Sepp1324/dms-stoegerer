# NetworkPolicy (P2): Die Daten-Stores (Postgres, Redis) nehmen Ingress NUR von
# Pods DESSELBEN Namespaces (dms) an – plus den Node-Flannel-Gateways (siehe
# ipBlock unten). Das kapselt DB + Broker gegen Zugriffe aus anderen
# Namespaces/Pods – die häufigste Lateral-Movement-Route.
#
# WARUM die ipBlock-Ausnahmen (2026-07-31): Der aktive Backup-CronJob läuft mit
# `hostNetwork: true` (backup-cronjob.yaml) – bewusst, damit SSH/rsync zur NAS von
# der Node-IP kommt (sonst sieht die NAS-Firewall die Pod-CIDR). hostNetwork-Pods
# erscheinen für die NetworkPolicy aber als NODE-Traffic (die Flannel-VTEP-Adresse
# `10.42.<node>.0`), NICHT als normaler Pod – `podSelector: {}` matcht sie deshalb
# NIE und der Backup-Pod wurde abgewiesen ("connection refused" /
# psycopg "server closed the connection unexpectedly"), während normale Pods
# (backend) durchkamen. Verifiziert am Cluster: ein hostNetwork-Pod verbindet mit
# `inet_client_addr() = 10.42.2.0`. Die drei /32-ipBlocks geben genau die
# Node-Gateways frei (k3s-01/02/03 = 10.42.0/1/2.0), sodass der hostNetwork-Backup
# durchkommt, OHNE die Namespace-Isolation aufzuweichen: fremde Pods in fremden
# Namespaces haben normale Pod-IPs (10.42.x.<n>, n>=2), kein `.0`, und bleiben
# draußen.
#
# HINWEIS: Kommt ein weiterer Node dazu, muss dessen Gateway (10.42.<neu>.0/32)
# hier ergänzt werden – sonst schlägt ein dort gescheduleter Backup-Pod fehl.
#
# RESTRISIKO (bewusst akzeptiert): Der ipBlock vertraut damit dem GESAMTEN
# Host-Network-Traffic dieser Nodes – nicht nur dem Backup-Pod. Jeder andere
# hostNetwork-Pod ODER Node-Prozess auf k3s-01/02/03 kann Postgres/Redis TCP
# erreichen (Passwort bleibt die zweite Schranke). Zudem ist der ipBlock an die
# Pod-CIDR gebunden und bricht bei Node-Neuaufbau/geänderter CIDR. Die saubere
# Härtung wäre ein ZWEISTUFIGES Backup: pg_dump/tar in einem NORMALEN Pod
# (Pod-Netz → matcht podSelector, KEIN ipBlock nötig) und der Offsite-Transfer in
# einem separaten hostNetwork-Pod OHNE DB-Zugriff. Dann bräuchte diese Policy gar
# keine ipBlock-Ausnahme mehr. Bewusst separat gehalten (größerer Umbau am
# Backup-Flow); solange nur der eine, bekannte Backup-Job hostNetwork nutzt, ist
# das Restrisiko im Ein-App-Heim-Cluster vertretbar.
#
# Bewusst KEIN namespace-weites default-deny und KEINE Egress-Regeln:
# * Der Web-Tier (frontend/backend) bleibt für den Traefik-Ingress erreichbar
#   (keine Policy selektiert ihn → er bleibt offen).
# * Egress bleibt offen (DNS + externe APIs: Anthropic, IMAP, psychosr).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-namespace
  namespace: dms
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # Alle Pods im selben Namespace (dms).
        - podSelector: {}
        # Node-Flannel-Gateways (hostNetwork-Backup erscheint als Node-Traffic).
        - ipBlock: { cidr: 10.42.0.0/32 }
        - ipBlock: { cidr: 10.42.1.0/32 }
        - ipBlock: { cidr: 10.42.2.0/32 }
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-namespace
  namespace: dms
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
        - ipBlock: { cidr: 10.42.0.0/32 }
        - ipBlock: { cidr: 10.42.1.0/32 }
        - ipBlock: { cidr: 10.42.2.0/32 }
      ports:
        - protocol: TCP
          port: 6379
