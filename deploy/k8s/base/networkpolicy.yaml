# ENTFERNT (2026-07-31): Die beiden NetworkPolicies (postgres-allow-namespace,
# redis-allow-namespace) sind DEAKTIVIERT und bewusst NICHT mehr in der
# kustomization eingebunden.
#
# Warum:
# Der in k3s eingebaute NetworkPolicy-Controller (kube-router) erzwingt diese
# Policies nur zuverlässig für Pods, die BEIM ANLEGEN der Policy bereits liefen
# (z. B. das langlebige backend-Deployment). DYNAMISCH erzeugte, kurzlebige Pods
# – insbesondere der Backup-CronJob – werden dagegen geblockt (TCP-Reset →
# "connection refused" bzw. psycopg "server closed the connection unexpectedly").
# Das legte den nächtlichen Backup-Job lahm: Weder `record_backup_status` (DB)
# noch `pg_dump` kamen an Postgres. Verifiziert 2026-07-31: OHNE Policy verbindet
# ein frischer Pod, MIT Policy (egal ob `podSelector: {}` ODER
# `namespaceSelector`) bekommt er "connection refused" – während das alte
# backend-Pod weiter durchkommt.
#
# Da `dms` praktisch der einzige App-Namespace in diesem Heim-Cluster ist (kein
# fremder Mandant, aus dem lateral zugegriffen würde), ist der Sicherheitsgewinn
# der Namespace-Isolation gering – der Schaden (kaputte Backups + jeder künftige
# CronJob/dynamische Pod betroffen) überwiegt klar. Die Redis-AUTH (Passwort
# REDIS_PASSWORD) und die übrigen Härtungen bleiben unberührt; nur die
# NetworkPolicy-Kapselung der Datastores entfällt.
#
# Wieder-Aktivierung nur sinnvoll, wenn der NetworkPolicy-Controller dynamische
# Pods korrekt behandelt (anderer CNI/Controller, z. B. Calico/Cilium) – dann
# `namespaceSelector: { kubernetes.io/metadata.name: dms }` verwenden und in die
# kustomization zurücknehmen.
