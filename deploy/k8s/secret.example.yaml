# Vorlage. Kopieren nach secret.yaml, echte Werte eintragen und anwenden.
# secret.yaml ist via .gitignore vom Repository ausgeschlossen.
#
#   cp secret.example.yaml secret.yaml
#   # Werte eintragen
#   kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: dms-secrets
  namespace: dms
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "bitte-langen-zufaelligen-wert-einsetzen"
  # Stabil halten: Postgres übernimmt dieses Passwort nur beim ersten initdb
  # des postgres-data PVC. Nicht per secretGenerator oder Zufall pro Deploy
  # rotieren, sonst können Backend/Worker nicht mehr einloggen.
  POSTGRES_PASSWORD: "bitte-sicheres-passwort"
  # Redis-Auth (P2): Redis startet mit --requirepass diesem Wert; Backend/Worker/
  # Beat weben ihn automatisch in REDIS_URL ein (settings._with_redis_auth). Muss
  # gesetzt sein, sonst weist Redis alle Verbindungen ab -> Celery/Cache down.
  REDIS_PASSWORD: "bitte-sicheres-redis-passwort"
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  # Shared Secret für den psychosr-Push (= dort POMODORO_TOKEN). Leer = Automatik aus.
  PSYCHOSR_TOKEN: ""
  # IMAP-Postfach für die E-Mail-Ingestion (Stufe 3). Der Name dieser Variable
  # wird im Django-Admin am E-Mail-Konto unter "password_env" hinterlegt
  # (z. B. IMAP_PASSWORD). App-Passwort verwenden, nicht das Login-Passwort.
  IMAP_PASSWORD: ""
---
# DB-Backup-Secret (P1/P2, Least-Privilege): NUR die Schlüssel, die der Backup-Pod
# tatsächlich braucht:
#   * POSTGRES_PASSWORD – für pg_dump; MUSS mit ``dms-secrets`` übereinstimmen
#     (an das initialisierte postgres-data-PVC gekoppelt).
#   * DJANGO_SECRET_KEY – der Command ``record_backup_status`` bootet Django, das
#     bei DJANGO_DEBUG=false einen SECRET_KEY verlangt. Dies ist bewusst ein
#     SEPARATER, ZUFÄLLIGER Wert – NICHT der produktive Schlüssel: der Backup-Pod
#     signiert keine Sessions/JWTs und entschlüsselt nichts (er schreibt nur eine
#     Status-Zeile). Ein eigener Wert verhindert, dass ein kompromittierter
#     Backup-Pod zusammen mit dem DB-Dump gespeicherte IMAP-Passwörter
#     entschlüsseln oder Sessions/JWTs fälschen kann.
# REDIS_PASSWORD wird NICHT gebraucht (kein Broker-Zugriff im Backup) und daher
# bewusst weggelassen. Der Backup-Pod bindet damit NICHT das gesamte ``dms-secrets``
# (Django/PG/Redis/AI/IMAP) ein.
#
# ⚠️ VOR dem Rollout anlegen: Der aktive backup-CronJob referenziert dieses Secret
# per ``secretKeyRef``. Fehlt es, startet der Backup-Pod mit
# CreateContainerConfigError. Dieses Secret also anlegen, BEVOR die zugehörige
# Manifest-Änderung ausgerollt wird.
apiVersion: v1
kind: Secret
metadata:
  name: dms-db-backup-secrets
  namespace: dms
type: Opaque
stringData:
  # EIGENER Zufallswert – NICHT der produktive DJANGO_SECRET_KEY aus dms-secrets.
  DJANGO_SECRET_KEY: "bitte-eigenen-langen-zufaelligen-backup-wert-einsetzen"
  POSTGRES_PASSWORD: "bitte-sicheres-passwort"   # == dms-secrets (PVC-gekoppelt)
---
# Backup-Secrets: SSH-Zugang zum NAS für Offsite-Backup.
# NICHTS davon ins Repo committen (secret.yaml ist gitignored).
apiVersion: v1
kind: Secret
metadata:
  name: dms-backup-secrets
  namespace: dms
type: Opaque
stringData:
  # SSH-Zielhost (NAS im Heimnetz oder remote).
  BACKUP_SSH_HOST: "nas.example.com"
  # SSH-Port auf dem NAS (Default im CronJob: 22). Beispiel Synology/Custom-Port: 260.
  BACKUP_SSH_PORT: "260"
  # SSH-Benutzer auf dem NAS.
  BACKUP_SSH_USER: "backup-user"
  # SSH Private Key (PEM-Format, mehrzeilig). Beispiel:
  # -----BEGIN OPENSSH PRIVATE KEY-----
  # b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAABlwAAAAdzc2gtcn
  # ...
  # -----END OPENSSH PRIVATE KEY-----
  BACKUP_SSH_KEY: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    HIER_DEN_ECHTEN_PRIVATE_KEY_EINFÜGEN
    -----END OPENSSH PRIVATE KEY-----
  # Zielpfad auf dem NAS (absolut, z. B. /volume1/backups/dms).
  BACKUP_TARGET_PATH: "/volume1/backups/dms"
  # Aufbewahrung: Anzahl der letzten Backups, die behalten werden (ältere rotieren).
  BACKUP_RETENTION: "7"
