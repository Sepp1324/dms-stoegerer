server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Sicherheits-Header (P2) ---
    # Clickjacking-Schutz: das SPA darf NICHT in fremde Frames eingebettet werden
    # (frame-ancestors ist die moderne Form; X-Frame-Options für Alt-Browser).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: restriktiv bei den gefährlichen Direktiven (kein Framing durch andere,
    # kein <base>/Plugin/Objekt-Missbrauch), permissiv genug für das Vite-SPA
    # (eigene Skripte/Styles; Styles brauchen 'unsafe-inline'). Bilder/PDF-Vorschau
    # laufen als data:/blob:/same-origin-iframe (Werkbank-Thumbnails, Preview).
    # connect-src 'self': API läuft same-origin über /api/.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # SPA-Fallback: alle nicht-Datei-Routen liefern index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API an das Backend weiterreichen (Service-Name im Cluster: backend)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
