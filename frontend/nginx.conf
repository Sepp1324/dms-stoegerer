server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Sicherheits-Header (P2) ---
    # Clickjacking-Schutz: das SPA darf nicht von FREMDEN Origins eingebettet werden.
    # BEWUSST 'self'/SAMEORIGIN statt 'none'/DENY: Die PDF-Vorschau lädt die Datei
    # per fetch als blob: und rendert sie in einem SAME-ORIGIN-iframe
    # (blob:https://<host>/…). Ein solches blob:-Dokument ERBT die CSP des
    # erzeugenden SPA – mit 'none' verweigerte der Browser dann das Framing durch den
    # eigenen Origin ("Refused to load blob:… frame-ancestors"). 'self' lässt genau
    # dieses same-origin-Framing zu und sperrt fremde Origins weiterhin (Clickjacking-
    # Schutz unverändert). X-Frame-Options SAMEORIGIN ist das passende Alt-Browser-Pendant.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: restriktiv bei den gefährlichen Direktiven (kein Framing durch FREMDE,
    # kein <base>/Plugin/Objekt-Missbrauch), permissiv genug für das Vite-SPA
    # (eigene Skripte/Styles; Styles brauchen 'unsafe-inline'). Bilder/PDF-Vorschau
    # laufen als data:/blob:/same-origin-iframe (Werkbank-Thumbnails, Preview).
    # connect-src 'self': API läuft same-origin über /api/.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # SPA-Fallback: alle nicht-Datei-Routen liefern index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API an das Backend weiterreichen (Service-Name im Cluster: backend)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
