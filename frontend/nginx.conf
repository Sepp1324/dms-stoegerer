server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- MIME-Typ für ES-Module (.mjs) ---
    # Die mime.types von nginx 1.27 kennen die Endung .mjs NICHT -> solche Dateien
    # gingen als application/octet-stream raus. Browser verweigern Modul-Skripte und
    # Modul-Worker mit diesem Typ strikt (zusätzlich erzwingt nosniff unten den
    # deklarierten Typ). Betroffen war der PDF.js-Worker (pdf.worker.min-*.mjs):
    # "'application/octet-stream' is not a valid JavaScript MIME type" -> die
    # PDF-Vorschau blieb leer.
    # WICHTIG: Ein types-Block auf Server-Ebene ERSETZT die vom http-Block geerbte
    # Tabelle komplett. Deshalb mime.types hier erneut einbinden und .mjs ergänzen
    # (mehrere types-Blöcke derselben Ebene addieren sich). Abgesichert durch
    # frontend/ci/verify-mime-types.sh (PR-Gate).
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        # PWA-Manifest (vite-plugin-pwa): ebenfalls nicht in den nginx-mime.types.
        application/manifest+json webmanifest;
    }

    # --- Sicherheits-Header (P2) ---
    # Clickjacking-Schutz: das SPA darf nicht von FREMDEN Origins eingebettet werden.
    # BEWUSST 'self'/SAMEORIGIN statt 'none'/DENY: Die PDF-Vorschau lädt die Datei
    # per fetch als blob: und rendert sie in einem SAME-ORIGIN-iframe
    # (blob:https://<host>/…). Ein solches blob:-Dokument ERBT die CSP des
    # erzeugenden SPA – mit 'none' verweigerte der Browser dann das Framing durch den
    # eigenen Origin ("Refused to load blob:… frame-ancestors"). 'self' lässt genau
    # dieses same-origin-Framing zu und sperrt fremde Origins weiterhin (Clickjacking-
    # Schutz unverändert). X-Frame-Options SAMEORIGIN ist das passende Alt-Browser-Pendant.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: restriktiv bei den gefährlichen Direktiven (kein Framing durch FREMDE,
    # kein <base>/Plugin/Objekt-Missbrauch), permissiv genug für das Vite-SPA
    # (eigene Skripte/Styles; Styles brauchen 'unsafe-inline'). Bilder/PDF-Vorschau
    # laufen als data:/blob:/same-origin-iframe (Werkbank-Thumbnails, Preview).
    # connect-src 'self': API läuft same-origin über /api/. blob: zusätzlich, weil
    # PDF.js (PdfViewer) die Vorschau per XHR von einer blob:-URL lädt – 'self' deckt
    # blob: nicht ab, der Browser blockt sonst mit "Unexpected server response (0)".
    # blob:-URLs kann nur Skript des eigenen Origins erzeugen, also kein Fremdzugriff.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; frame-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # SPA-Fallback: alle nicht-Datei-Routen liefern index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API an das Backend weiterreichen (Service-Name im Cluster: backend)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
