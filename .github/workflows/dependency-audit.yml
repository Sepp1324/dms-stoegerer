name: dependency-audit

# Automatisierter Abhängigkeits-Scan (P2): Frontend (npm) + Backend (pip).
# Läuft bei jedem PR und wöchentlich. Bewusst so gestuft, dass die CI nicht sofort
# an vorbestehenden high/moderate-Findings rot wird: ALLE Findings werden im
# Job-Summary berichtet, blockierend ist nur CRITICAL in den PRODUKTIONS-Deps.
# Die Schwelle kann später verschärft werden, sobald die gemeldeten Pakete
# (u. a. react-router, dompurify) aktualisiert sind.
on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # montags 06:00 UTC
  workflow_dispatch:

jobs:
  frontend-npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (ohne Scripts)
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Audit-Bericht (alle Ebenen, nicht blockierend)
        working-directory: frontend
        run: |
          {
            echo "### Frontend – npm audit (Produktion)"
            echo '```'
            npm audit --omit=dev || true
            echo '```'
            echo "### Frontend – npm audit (inkl. dev/Tooling)"
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Gate – moderate+ Advisories blockieren (außer dokumentierte Waiver)
        # Verbindlich: der Job wird rot, sobald eine Produktions-Abhängigkeit eine
        # Verwundbarkeit ab Schweregrad moderate hat, die NICHT in
        # frontend/.npm-audit-ignore dokumentiert gewaivert ist. Jeder Waiver trägt
        # dort eine Begründung (nicht anwendbar oder ohne Release-Fix). ``npm audit``
        # kennt keine native Ignore-Liste, daher die Auswertung über --json.
        working-directory: frontend
        run: |
          npm audit --omit=dev --json > audit.json || true
          python3 - <<'PY'
          import json, os, re, sys
          THRESHOLD = {"moderate", "high", "critical"}
          ignore = set()
          if os.path.exists(".npm-audit-ignore"):
              for line in open(".npm-audit-ignore"):
                  line = line.strip()
                  if line and not line.startswith("#"):
                      ignore.add(line.split()[0])
          data = json.load(open("audit.json"))
          seen, unwaived = set(), []
          for _name, vuln in data.get("vulnerabilities", {}).items():
              for via in vuln.get("via", []):
                  if not isinstance(via, dict):
                      continue
                  sev = via.get("severity")
                  m = re.search(r"GHSA-[0-9a-z-]+", via.get("url", ""))
                  ghsa = m.group(0) if m else via.get("url", "?")
                  if sev in THRESHOLD and ghsa not in ignore and ghsa not in seen:
                      seen.add(ghsa)
                      unwaived.append((sev, ghsa, via.get("title", "")))
          if unwaived:
              print("Nicht gewaiverte Advisories (moderate+):")
              for sev, ghsa, title in unwaived:
                  print(f"  [{sev}] {ghsa} – {title}")
              sys.exit(1)
          print("Keine nicht-gewaiverten moderate+ Advisories.")
          PY

  backend-pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit installieren
        run: pip install pip-audit
      - name: Audit-Bericht (alle Findings, nicht blockierend)
        # Vollständiger Bericht (inkl. dokumentierter Waiver) fürs Job-Summary und
        # als Klartext im Log – Letzteres, damit neue Advisory-IDs sichtbar sind.
        run: |
          {
            echo "### Backend – pip-audit (requirements.txt, vollständig)"
            echo '```'
            pip-audit -r backend/requirements.txt --progress-spinner off || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::group::pip-audit (Klartext fürs Log)"
          pip-audit -r backend/requirements.txt --progress-spinner off || true
          echo "::endgroup::"
      - name: Gate – nicht gewaiverte Advisories blockieren
        # Verbindlich (kein `|| true`): der Job wird rot, sobald eine Verwundbarkeit
        # auftaucht, die NICHT in backend/.pip-audit-ignore dokumentiert gewaivert
        # ist. Jeder Waiver trägt dort eine Begründung (z. B. Pillow an der
        # fastembed-Decke, ohne verfügbaren Fix). So ist der Audit binding, ohne an
        # den bewusst akzeptierten Restrisiken dauerhaft rot zu stehen.
        working-directory: backend
        run: |
          IGNORE_ARGS=""
          if [ -f .pip-audit-ignore ]; then
            while IFS= read -r line; do
              case "$line" in
                ''|\#*) continue ;;  # Leerzeilen/Kommentare überspringen
              esac
              id="${line%%[[:space:]]*}"   # erstes Token = Advisory-ID
              IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $id"
            done < .pip-audit-ignore
          fi
          echo "Waiver: ${IGNORE_ARGS:-<keine>}"
          # shellcheck disable=SC2086
          pip-audit -r requirements.txt --progress-spinner off $IGNORE_ARGS
